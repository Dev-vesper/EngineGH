[workspace]
resolver = "2"
members = [
    "crates/engine_platform",
    "crates/engine_camera",
    "crates/engine_render",
    "crates/engine_editor",
    "crates/engine_memory",
    "apps/benchmark",
    "apps/sandbox",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
glam = { version = "0.34", features = ["bytemuck"] }
wgpu = "30"
winit = "0.30"
raw-window-handle = "0.6"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
log = "0.4"
env_logger = "0.11"

engine_platform = { path = "crates/engine_platform" }
engine_camera = { path = "crates/engine_camera" }
engine_render = { path = "crates/engine_render" }
engine_editor = { path = "crates/engine_editor" }
engine_memory = { path = "crates/engine_memory" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
